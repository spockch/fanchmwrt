name: Build ZN-M2 FanchMWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential \
        clang flex bison g++ gawk gcc-multilib \
        gettext git libncurses-dev libssl-dev \
        python3 rsync unzip zlib1g-dev

    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Compile
      run: |
        make defconfig
        make -j$(nproc)
